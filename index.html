<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://cdn.shopify.com/oxygen-v2/45167/41063/86456/2584282/assets/tailwind-wX2uvJ37.css">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>EuaShow Special Live - Easter Edition</title>

  <meta name="theme-color" content="rgba(255, 228, 196, 1)">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" />

<style>
/* ========== EASTER THEME STYLES ========== */
.fixed-header,
.fixed-footer {
  padding: 20px 30px !important;
  font-size: 1.4rem;
}

.store-text {
  font-size: 1.6rem;
  font-weight: 700;
}

header img {
  width: 50px;
  height: 50px;
}

/* Easter egg falling animation */
.easter-egg {
  position: fixed;
  top: -50px;
  font-size: 2em;
  pointer-events: none;
  animation: fall-egg linear infinite;
  filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
}

@keyframes fall-egg {
  0% { 
    transform: translateY(0) rotate(0deg); 
    opacity: 1; 
  }
  100% { 
    transform: translateY(110vh) rotate(360deg); 
    opacity: 0.5; 
  }
}

/* Easter bunny decoration */
.easter-bunny {
  position: fixed;
  bottom: 20px;
  left: 20px;
  font-size: 80px;
  z-index: 9999;
  animation: hop 2s ease-in-out infinite;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
}

@keyframes hop {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}

/* Flowers decoration */
.easter-flowers {
  position: fixed;
  bottom: 20px;
  right: 20px;
  font-size: 60px;
  z-index: 9999;
  animation: bloom 3s ease-in-out infinite;
}

@keyframes bloom {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

/* ========== EASTER COLOR SCHEME ========== */
.ds-body {
  background: linear-gradient(135deg, #FFE5B4, #FFD700, #98FB98, #87CEEB);
  background-size: 400% 400%;
  animation: gradient-shift 15s ease infinite;
  min-height: 100vh;
  color: #333;
  font-family: 'Orbitron', sans-serif;
}

@keyframes gradient-shift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.ds-title {
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
}

.ds-gradient {
  background: linear-gradient(135deg, #FF69B4 0%, #FFD700 50%, #98FB98 100%);
}

.fixed-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
}

.fixed-footer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 1000;
}

.grey-gradient {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(255, 240, 245, 0.85));
  backdrop-filter: blur(10px);
  border: 3px solid #FFD700;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px;
}

.visible {
  opacity: 1;
}

/* Tailwind utility classes */
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-center { justify-content: center; }
.justify-between { justify-content: space-between; }
.gap-4 { gap: 1rem; }
.gap-10 { gap: 2.5rem; }
.w-full { width: 100%; }
.max-w-xl { max-width: 36rem; }
.p-4 { padding: 1rem; }
.pt-40 { padding-top: 10rem; }
.pb-32 { padding-bottom: 8rem; }
.mt-4 { margin-top: 1rem; }
.rounded { border-radius: 0.25rem; }
.rounded-xl { border-radius: 0.75rem; }
.shadow-lg { box-shadow: 0 10px 15px -3px rgba(255,215,0,0.3), 0 4px 6px -2px rgba(255,105,180,0.2); }
.text-center { text-align: center; }
.text-lg { font-size: 1.125rem; line-height: 1.75rem; }

/* ========== EASTER HbbTV RED BUTTON (now EASTER EGG BUTTON) ========== */
.hbbtv-red-button {
  position: fixed;
  top: 100px;
  right: 30px;
  z-index: 10000;
  background: linear-gradient(135deg, #FF69B4, #FFD700);
  color: white;
  padding: 12px 24px;
  border-radius: 20px;
  font-family: 'Orbitron', sans-serif;
  font-size: 1.2rem;
  font-weight: 700;
  cursor: pointer;
  border: 3px solid #FF1493;
  box-shadow: 0 4px 15px rgba(255, 105, 180, 0.5);
  transition: transform 0.2s, box-shadow 0.2s;
}

.hbbtv-red-button:hover {
  transform: scale(1.05) rotate(5deg);
  box-shadow: 0 6px 20px rgba(255, 215, 0, 0.7);
}

.hbbtv-red-button:active {
  transform: scale(0.98);
}

/* Easter overlay menu */
.hbbtv-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(255, 240, 245, 0.95);
  z-index: 10001;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  gap: 20px;
}

.hbbtv-overlay.active {
  display: flex;
}

.hbbtv-menu {
  background: linear-gradient(135deg, #FFF0F5, #FFE4E1);
  border: 4px solid #FFD700;
  border-radius: 30px;
  padding: 40px 60px;
  box-shadow: 0 10px 40px rgba(255, 105, 180, 0.4);
}

.hbbtv-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 2.5rem;
  color: #FF1493;
  text-align: center;
  margin-bottom: 30px;
  text-shadow: 2px 2px 4px rgba(255, 215, 0, 0.5);
}

.hbbtv-options {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
}

.hbbtv-option {
  background: linear-gradient(135deg, #FFB6C1, #FFD700);
  color: #333;
  padding: 30px 40px;
  border-radius: 20px;
  font-family: 'Orbitron', sans-serif;
  font-size: 1.4rem;
  font-weight: 700;
  cursor: pointer;
  border: 3px solid #FF69B4;
  transition: all 0.3s;
  text-align: center;
}

.hbbtv-option:hover {
  background: linear-gradient(135deg, #FF69B4, #FFD700);
  transform: translateY(-5px) rotate(2deg);
  box-shadow: 0 8px 20px rgba(255, 105, 180, 0.6);
}

.hbbtv-option:active {
  transform: translateY(0);
}
</style>
</head>

<body class="ds-body">

<!-- EASTER EGGS CONTAINER -->
<div id="eggs-container"></div>

<!-- EASTER BUNNY -->
<div class="easter-bunny">🐰</div>

<!-- EASTER FLOWERS -->
<div class="easter-flowers">🌷🌸🌺</div>

<!-- ========== EASTER EGG BUTTON ========== -->
<button class="hbbtv-red-button" id="red-button">🥚 IHB TV</button>

<!-- ========== EASTER OVERLAY MENU ========== -->
<div class="hbbtv-overlay" id="hbbtv-overlay">
  <div class="hbbtv-menu">
    <div class="hbbtv-title">🐣 IHB TV Easter Menu 🌷</div>
    <div class="hbbtv-options">
      <div class="hbbtv-option" data-action="live-tv">📡 Live TV</div>
      <div class="hbbtv-option" data-action="local-news">📰 Local News</div>
      <div class="hbbtv-option" data-action="catch-up">⏮️ Catch-Up TV</div>
      <div class="hbbtv-option" data-action="settings">⚙️ Settings</div>
    </div>
  </div>
</div>

<!-- HEADER -->
<header class="fixed-header ds-title ds-gradient flex items-center justify-between">
  <div class="flex items-center gap-4">
    <img src="nano-logo2.png" class="header-logo" />
    <span class="store-text">🐣 EuaShow Easter Special Live 🌷</span>
  </div>
</header>

<!-- MAIN -->
<main class="container ds-body visible flex flex-col items-center justify-center pt-40 pb-32">
  <div class="w-full max-w-xl p-4 grey-gradient rounded-xl shadow-lg">
    <iframe id="player" src="https://unprayerful-attractively-shanna.ngrok-free.dev/live" class="w-full mt-4 rounded" style="aspect-ratio: 16/9; border: none;" allow="autoplay; fullscreen; picture-in-picture; microphone; camera" allowfullscreen></iframe>
  </div>
</main>

<!-- FOOTER -->
<footer class="fixed-footer ds-title ds-gradient text-center">
  <nav class="flex justify-center gap-10 text-lg">
    <a href="#">Built by EuaShow</a>
    <a href="#">©2025 - 2026</a>
    <a href="#">Created by PanosTsak & PlayPieTeam Dev Team</a>
  </nav>
</footer>

<!-- ========== SCRIPTS ========== -->
<script>
/* ========== EASTER: Falling eggs animation ========== */
function createEasterEggs() {
  const eggsContainer = document.getElementById("eggs-container");
  const eggEmojis = ['🥚', '🐣', '🐰', '🌷', '🌸', '🌺', '🦋', '🐝'];
  
  for (let i = 0; i < 40; i++) {
    let egg = document.createElement("div");
    egg.classList.add("easter-egg");
    egg.innerHTML = eggEmojis[Math.floor(Math.random() * eggEmojis.length)];
    egg.style.left = Math.random() * 100 + "vw";
    egg.style.animationDuration = 8 + Math.random() * 8 + "s";
    egg.style.fontSize = (20 + Math.random() * 30) + "px";
    egg.style.opacity = 0.6 + Math.random() * 0.4;
    egg.style.animationDelay = Math.random() * 5 + "s";
    eggsContainer.appendChild(egg);
  }
}
createEasterEggs();
</script>

<script>
/* =========================================================================
   SIMPLE IFRAME INTEGRATION
   ========================================================================= */

// ========== STREAM CONFIGURATION ==========
const STREAMS = {
  LIVE: "https://unprayerful-attractively-shanna.ngrok-free.dev/live",
  CATCHUP: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
};

// ========== HbbTV EASTER EGG BUTTON FUNCTIONALITY ==========
window.addEventListener("DOMContentLoaded", () => {
  const player = document.getElementById("player");
  const redButton = document.getElementById("red-button");
  const overlay = document.getElementById("hbbtv-overlay");
  const options = document.querySelectorAll(".hbbtv-option");

  // Easter egg button - open overlay
  redButton.addEventListener("click", () => {
    overlay.classList.add("active");
  });

  // Handle menu options
  options.forEach(option => {
    option.addEventListener("click", () => {
      const action = option.getAttribute("data-action");
      console.log("🎯 Action:", action);

      switch (action) {
        case "live-tv":
          overlay.classList.remove("active");
          player.src = STREAMS.LIVE;
          break;

        case "local-news":
          window.location.href = "https://ntv-starting.my.canva.site/---";
          break;

        case "catch-up":
          overlay.classList.remove("active");
          player.src = STREAMS.CATCHUP;
          break;

        case "settings":
          overlay.classList.remove("active");
          alert("⚙️ Settings\n\nVideo Quality: Auto\nSubtitles: Off\nLanguage: English");
          break;
      }
    });
  });

  // Close overlay on outside click
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) {
      overlay.classList.remove("active");
    }
  });

  // Remote control RED button (HbbTV)
  document.addEventListener("keydown", (e) => {
    if (e.keyCode === 403) {
      e.preventDefault();
      redButton.click();
    }
  });
});
</script>

</body>
</html>
