<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://cdn.shopify.com/oxygen-v2/45167/41063/86456/2584282/assets/tailwind-wX2uvJ37.css">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>EuaShow Special Live</title>

  <meta name="theme-color" content="rgba(214, 243, 255, 1)">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" />

<style>
/* ========== EXISTING STYLES (UNCHANGED) ========== */
.fixed-header,
.fixed-footer {
  padding: 20px 30px !important;
  font-size: 1.4rem;
}

.store-text {
  font-size: 1.6rem;
  font-weight: 700;
}

header img {
  width: 50px;
  height: 50px;
}

.snowflake {
  position: fixed;
  top: -10px;
  color: white;
  font-size: 1em;
  pointer-events: none;
  animation: fall linear infinite;
}

@keyframes fall {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(110vh); opacity: 0.3; }
}

.christmas-tree {
  position: fixed;
  bottom: 20px;
  left: 20px;
  width: 120px;
  z-index: 9999;
  animation: glow 3s ease-in-out infinite;
}

@keyframes glow {
  0% { filter: drop-shadow(0 0 5px red); }
  50% { filter: drop-shadow(0 0 18px yellow); }
  100% { filter: drop-shadow(0 0 5px red); }
}

/* ========== EXISTING UTILITY CLASSES (from original page) ========== */
.ds-body {
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  min-height: 100vh;
  color: white;
  font-family: 'Orbitron', sans-serif;
}

.ds-title {
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
}

.ds-gradient {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}

.fixed-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
}

.fixed-footer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 1000;
}

.grey-gradient {
  background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
  backdrop-filter: blur(10px);
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px;
}

.visible {
  opacity: 1;
}

/* Tailwind utility classes used in HTML */
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-center { justify-content: center; }
.justify-between { justify-content: space-between; }
.gap-4 { gap: 1rem; }
.gap-10 { gap: 2.5rem; }
.w-full { width: 100%; }
.max-w-xl { max-width: 36rem; }
.p-4 { padding: 1rem; }
.pt-40 { padding-top: 10rem; }
.pb-32 { padding-bottom: 8rem; }
.mt-4 { margin-top: 1rem; }
.rounded { border-radius: 0.25rem; }
.rounded-xl { border-radius: 0.75rem; }
.shadow-lg { box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05); }
.text-center { text-align: center; }
.text-lg { font-size: 1.125rem; line-height: 1.75rem; }

/* ========== HbbTV RED BUTTON OVERLAY STYLES ========== */
.hbbtv-red-button {
  position: fixed;
  top: 100px;
  right: 30px;
  z-index: 10000;
  background: linear-gradient(135deg, #ff0000, #cc0000);
  color: white;
  padding: 12px 24px;
  border-radius: 8px;
  font-family: 'Orbitron', sans-serif;
  font-size: 1.2rem;
  font-weight: 700;
  cursor: pointer;
  border: 3px solid white;
  box-shadow: 0 4px 15px rgba(255, 0, 0, 0.5);
  transition: transform 0.2s, box-shadow 0.2s;
}

.hbbtv-red-button:hover {
  transform: scale(1.05);
  box-shadow: 0 6px 20px rgba(255, 0, 0, 0.7);
}

.hbbtv-red-button:active {
  transform: scale(0.98);
}

.hbbtv-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 0, 0.95);
  z-index: 10001;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  gap: 20px;
}

.hbbtv-overlay.active {
  display: flex;
}

.hbbtv-menu {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border: 4px solid #00d4ff;
  border-radius: 20px;
  padding: 40px 60px;
  box-shadow: 0 10px 40px rgba(0, 212, 255, 0.4);
}

.hbbtv-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 2.5rem;
  color: #00d4ff;
  text-align: center;
  margin-bottom: 30px;
  text-shadow: 0 0 10px rgba(0, 212, 255, 0.8);
}

.hbbtv-options {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
}

.hbbtv-option {
  background: linear-gradient(135deg, #0f3460, #16213e);
  color: white;
  padding: 30px 40px;
  border-radius: 12px;
  font-family: 'Orbitron', sans-serif;
  font-size: 1.4rem;
  font-weight: 700;
  cursor: pointer;
  border: 3px solid #00d4ff;
  transition: all 0.3s;
  text-align: center;
}

.hbbtv-option:hover {
  background: linear-gradient(135deg, #00d4ff, #0099cc);
  transform: translateY(-5px);
  box-shadow: 0 8px 20px rgba(0, 212, 255, 0.6);
}

.hbbtv-option:active {
  transform: translateY(0);
}
</style>
</head>

<body class="ds-body">

<!-- SNOW CONTAINER -->
<div id="snow-container"></div>

<!-- CHRISTMAS TREE -->
<img src="4-47898_transparent-xmas-tree-png-clipart-clip-art-christmas.png" class="christmas-tree" alt="Christmas Tree">

<!-- HbbTV RED BUTTON -->
<button class="hbbtv-red-button" id="red-button">IHB TV</button>

<!-- HbbTV OVERLAY MENU -->
<div class="hbbtv-overlay" id="hbbtv-overlay">
  <div class="hbbtv-menu">
    <div class="hbbtv-title">📺 IHB TV Menu</div>
    <div class="hbbtv-options">
      <div class="hbbtv-option" data-action="live-tv">📡 Live TV</div>
      <div class="hbbtv-option" data-action="local-news">📰 Local News</div>
      <div class="hbbtv-option" data-action="catch-up">⏮️ Catch-Up TV</div>
      <div class="hbbtv-option" data-action="settings">⚙️ Settings</div>
    </div>
  </div>
</div>

<!-- HEADER -->
<header class="fixed-header ds-title ds-gradient flex items-center justify-between">
  <div class="flex items-center gap-4">
    <img src="nano-logo2.png" class="header-logo" />
    <span class="store-text">EuaShow Special Live</span>
  </div>
</header>

<!-- MAIN -->
<main class="container ds-body visible flex flex-col items-center justify-center pt-40 pb-32">
  <div class="w-full max-w-xl p-4 grey-gradient rounded-xl shadow-lg">
    <iframe id="player" src="https://oaks-compound-pie-korea.trycloudflare.com/live" class="w-full mt-4 rounded" style="aspect-ratio: 16/9; border: none;" allowfullscreen></iframe>
  </div>
</main>

<!-- FOOTER -->
<footer class="fixed-footer ds-title ds-gradient text-center">
  <nav class="flex justify-center gap-10 text-lg">
    <a href="#">Built by EuaShow</a>
    <a href="#">©2025 - 2026</a>
    <a href="#">Created by PanosTsak & PlayPieTeam Dev Team</a>
  </nav>
</footer>

<!-- ========== SCRIPTS ========== -->
<script>
/* ========== Snowfall generator ========== */
function createSnow() {
  const snowContainer = document.getElementById("snow-container");
  for (let i = 0; i < 60; i++) {
    let snow = document.createElement("div");
    snow.classList.add("snowflake");
    snow.innerHTML = "❄";
    snow.style.left = Math.random() * 100 + "vw";
    snow.style.animationDuration = 4 + Math.random() * 6 + "s";
    snow.style.fontSize = (8 + Math.random() * 18) + "px";
    snow.style.opacity = Math.random();
    snowContainer.appendChild(snow);
  }
}
createSnow();
</script>

<script>
/* =========================================================================
   SIMPLE IFRAME INTEGRATION FOR MEDIAMTX
   ========================================================================= */

// ========== STREAM CONFIGURATION ==========
const STREAMS = {
  LIVE: "https://oaks-compound-pie-korea.trycloudflare.com/live/",
  CATCHUP: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
};

// ========== HbbTV RED BUTTON FUNCTIONALITY ==========
window.addEventListener("DOMContentLoaded", () => {
  const player = document.getElementById("player");
  const redButton = document.getElementById("red-button");
  const overlay = document.getElementById("hbbtv-overlay");
  const options = document.querySelectorAll(".hbbtv-option");

  // Red button - open overlay
  redButton.addEventListener("click", () => {
    overlay.classList.add("active");
  });

  // Handle menu options
  options.forEach(option => {
    option.addEventListener("click", () => {
      const action = option.getAttribute("data-action");
      console.log("🎯 Action:", action);

      switch (action) {
        case "live-tv":
          overlay.classList.remove("active");
          player.src = STREAMS.LIVE;
          break;

        case "local-news":
          window.location.href = "https://ntv-starting.my.canva.site/---";
          break;

        case "catch-up":
          overlay.classList.remove("active");
          player.src = STREAMS.CATCHUP;
          break;

        case "settings":
          overlay.classList.remove("active");
          alert("⚙️ Settings\n\nVideo Quality: Auto\nSubtitles: Off\nLanguage: English");
          break;
      }
    });
  });

  // Close overlay on outside click
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) {
      overlay.classList.remove("active");
    }
  });

  // Remote control RED button (HbbTV)
  document.addEventListener("keydown", (e) => {
    if (e.keyCode === 403) {
      e.preventDefault();
      redButton.click();
    }
  });
});
</script>

<!-- Load hls.js for catch-up TV fallback -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

</body>
</html>
